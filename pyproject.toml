[project]
name = "cpsrbd"
version = "0.1.0"
description = "One graph for physical failure and cyber attack: reliability block diagrams and attack trees unified for consequence-driven (CCE-style) analysis of cyber-physical systems."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gabriel Milanez Cavalheri", email = "gmcavalheri@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "networkx>=3.3",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "ipykernel>=6.29",
    "mypy>=1.11",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-networkx>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpsrbd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["cpsrbd"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# notebooks are generated by notebooks/build_notebooks.py; lint that file instead
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = [
    "E741",  # single-letter math names (l, I) are idiomatic here
]

[tool.ruff.lint.per-file-ignores]
"notebooks/build_notebooks.py" = ["E501"]  # notebook cell sources are string literals

[tool.ruff.lint.isort]
# validation/ scripts import their sibling helper module directly
known-local-folder = ["common"]
